<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- 经典马拉松终端模块图标。
     构成与原版一致：绿色圆盘 + 内部圆环 + 竖直短柄，三个图元的圆心、半径、
     位置、线宽均未改动。区别仅在于圆环与短柄改为从圆盘上挖空（alpha=0），
     而非用黑色填充覆盖，这样首页统一的单色滤镜（filter: brightness(0)
     invert(1)）无法把它们抹平——形状由透明度表达，不再依赖颜色差异。
     原文件历史见提交 3660d8d。 -->
<svg
   width="143.10384mm"
   height="143.10384mm"
   viewBox="37.195508 74.563465 143.10384 143.10384"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <mask
       id="classic-marathon-cut"
       maskUnits="userSpaceOnUse"
       maskContentUnits="userSpaceOnUse"
       x="37.195508"
       y="74.563465"
       width="143.10384"
       height="143.10384">
      <rect
         x="37.195508"
         y="74.563465"
         width="143.10384"
         height="143.10384"
         fill="#ffffff" />
      <circle
         cx="108.747"
         cy="124.61005"
         r="35.236885"
         fill="none"
         stroke="#000000"
         stroke-width="4"
         stroke-dasharray="none" />
      <rect
         x="108.21783"
         y="160.54054"
         width="3.0579147"
         height="56.279945"
         fill="#000000"
         stroke="none" />
    </mask>
  </defs>
  <g
     id="layer1"
     transform="translate(0,0)">
    <circle
       cx="108.74741"
       cy="146.11539"
       r="71.132874"
       fill="#00ff00"
       fill-opacity="1"
       stroke="#ffffff"
       stroke-width="0.838088"
       mask="url(#classic-marathon-cut)"
       id="path1" />
  </g>
</svg>
