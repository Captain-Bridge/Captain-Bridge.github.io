<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经典马拉松终端文本</title>
  <link rel="stylesheet" href="/css/community-theme.css">
  <meta name="description" content="Classic Marathon terminal shell">
  <style>
    :root {
      --bg: #000;
      --fg: rgb(0, 255, 0);
      --muted: rgba(244, 244, 244, 0.72);
      --soft: rgba(244, 244, 244, 0.42);
      --line: rgba(244, 244, 244, 0.12);
      --red: rgb(100, 0, 0);
      --focus: rgba(244, 244, 244, 0.12);
      --term-line: 19px;
      --term-lines: 20;
      --term-pad-y: 16px;
      --term-pad-x: 22px;
      --term-topbar: 14px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Consolas", "Lucida Console", "Courier New", monospace;
    }
    body {
      min-height: 100vh;
      overflow: hidden;
    }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 14px;
      padding: 16px 18px 18px;
    }
    .topline {
      min-height: 26px;
      display: flex;
      align-items: center;
      color: var(--fg);
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .series-switch { display:flex; gap:12px; margin-left:24px; }
    .series-switch button { border:0; border-bottom:1px solid transparent; padding:0; background:transparent; color:var(--muted); font:inherit; cursor:pointer; }
    .series-switch button[aria-pressed="true"] { color:var(--fg); border-bottom-color:var(--fg); }
    .source-thanks {
      position: fixed;
      z-index: 10;
      left: 0;
      right: 0;
      bottom: 8px;
      min-height: 18px;
      color: var(--soft);
      font-size: 11px;
      letter-spacing: .04em;
      text-align: center;
    }
    .source-thanks a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .source-thanks a:hover,
    .source-thanks a:focus-visible { color: var(--fg); }
    .workspace {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 36px;
      min-height: 0;
      align-items: start;
    }
    .menu-grid {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      left: 0;
      top: 0;
      display: grid;
      width: 100%;
      grid-template-columns: minmax(0, 1fr) minmax(130px, 0.42fr);
      gap: 16px;
      align-content: start;
    }
    .menu-grid .rail:last-child {
      justify-self: end;
      width: max-content;
      max-width: min(180px, 16vw);
    }
    .menu-grid .rail {
      pointer-events: auto;
      width: max-content;
    }
    /* Chapter navigation keeps a stable horizontal footprint while groups
       are collapsed/expanded; only its vertical contents should change. */
    .menu-grid .rail:first-child {
      width: 390px;
      min-width: 390px;
    }
    .rail {
      display: grid;
      align-content: start;
      gap: 10px;
      padding-top: 4px;
    }
    .rail[hidden] {
      display: none;
    }
    .rail-label {
      color: var(--soft);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .rail-list {
      display: grid;
      gap: 4px;
      max-height: calc(100vh - 170px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.22) transparent;
    }
    .rail-list::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .rail-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.22);
      border-radius: 0;
    }
    .rail-item {
      width: fit-content;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 13px;
      line-height: 1.35;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }
    .rail-item[aria-selected="true"] {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .rail-item[disabled] {
      opacity: 0.28;
      cursor: not-allowed;
    }
    .rail-item.indent {
      margin-left: 12px;
    }
    .rail-item.terminal {
      font-size: 12px;
      letter-spacing: 0.02em;
    }
    .rail-group {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 12px 0 2px;
      padding: 4px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .rail-group-toggle {
      flex: 0 0 auto;
      width: 30px;
      padding: 7px 0;
      border: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 11px;
      line-height: 1;
      text-align: center;
      cursor: pointer;
    }
    .rail-group-title {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: left;
      cursor: pointer;
    }
    .rail-group:hover,
    .rail-group-toggle:focus-visible,
    .rail-group-title:focus-visible {
      background: var(--focus);
    }
    .rail-group[aria-current="true"] .rail-group-title {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .terminal-screen.cover-mode .terminal-strip {
      display: none;
    }
    .terminal-screen.cover-mode .terminal-body {
      justify-content: flex-start;
      align-items: flex-start;
      overflow-y: auto;
    }
    .chapter-cover {
      display: grid;
      gap: 14px;
      justify-items: center;
      align-content: start;
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 10px 0;
    }
    .chapter-cover-image {
      display: block;
      cursor: zoom-in;
      max-width: min(100%, 560px);
      width: 100%;
      height: auto;
      image-rendering: pixelated;
    }
    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .92);
      cursor: zoom-out;
    }
    .image-lightbox[hidden] { display: none; }
    .image-lightbox img {
      display: block;
      max-width: min(96vw, 1400px);
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      image-rendering: pixelated;
    }
    .chapter-cover-title {
      color: var(--fg);
      font-size: 15px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      text-align: center;
    }
    .chapter-cover-intro {
      box-sizing: border-box;
      width: 100%;
      max-width: 560px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: left;
      margin: 0;
      padding: 0 8px;
    }
    .chapter-cover.chapter-one .chapter-cover-image {
      width: min(560px, 100%);
      max-height: 240px;
      object-fit: contain;
    }
    .chapter-cover.chapter-one .chapter-cover-intro {
      display: block;
      width: min(560px, 100%) !important;
      max-width: min(560px, 100%) !important;
      min-width: 0;
      white-space: pre-wrap;
      overflow: hidden;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .viewport {
      grid-column: 1;
      width: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
      padding: 0;
    }
    .terminal-shell {
      display: grid;
      justify-items: center;
      gap: 0;
      width: min(100%, 640px);
    }
    .terminal-frame {
      position: relative;
      width: 100%;
      display: grid;
      gap: 0;
    }
    .terminal-screen {
      position: relative;
      width: 100%;
      height: calc((var(--term-line) * var(--term-lines)) + (var(--term-pad-y) * 2) + (var(--term-topbar) * 2));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .terminal-strip {
      flex: 0 0 14px;
      background: var(--red);
      display: flex;
      align-items: center;
      padding: 0 8px;
      pointer-events: none;
    }
    .terminal-strip-text {
      color: rgb(255, 0, 0);
      font: inherit;
      font-size: 11px;
      line-height: 1;
    }
    .terminal-strip-meta {
      justify-content: space-between;
      gap: 12px;
    }
    .terminal-content {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-height: 0;
      padding: calc(var(--term-pad-y) + 4px) var(--term-pad-x) calc(var(--term-pad-y) + 4px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .terminal-body {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 13px;
      line-height: 1.35;
      overflow: auto;
      text-align: center;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.22) transparent;
    }
    .terminal-body::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .terminal-body::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.22);
      border-radius: 0;
    }
    .terminal-row {
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }
    .terminal-row.dim { color: var(--soft); }
    .terminal-row.muted { color: var(--muted); }
    .terminal-block {
      display: grid;
      gap: 6px;
      margin-top: 2px;
      justify-items: center;
    }
    .terminal-block .line {
      font-size: 12px;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }
    .doc-section {
      display: grid;
      gap: 8px;
      width: max-content;
      min-width: 100%;
      max-width: none;
      justify-items: center;
      padding: 0;
    }
    .doc-section.centered {
      margin: auto 0;
    }
    .doc-section.information {
      justify-items: start;
    }
    .doc-image {
      display: block;
      max-width: min(100%, 300px);
      height: auto;
      object-fit: contain;
    }
    .doc-text {
      width: max-content;
      max-width: none;
      margin: 0;
      color: var(--fg);
      white-space: pre;
      text-align: left;
      overflow-wrap: normal;
      word-break: normal;
      font: inherit;
      font-size: 13px;
      line-height: 1.45;
    }
    .ao-bold {
      font-weight: 700;
    }
    .ao-italic {
      font-style: italic;
    }
    .ao-underline {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .doc-section.centered .doc-text {
      text-align: center;
    }
    .doc-section.information .doc-text {
      width: max-content;
      margin-left: 0;
      text-align: left;
    }
    .doc-pict {
      display: grid;
      grid-template-columns: minmax(120px, 200px) minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      width: max-content;
      min-width: min(100%, 620px);
    }
    .doc-pict .doc-text {
      width: auto;
    }
    .doc-section.centered .doc-image,
    .doc-section.centered .doc-text {
      justify-self: center;
    }
    .loading-state {
      color: var(--soft);
      font-size: 12px;
      text-align: center;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      margin: 0;
      color: var(--soft);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .pager-host {
      flex: 0 0 auto;
      padding-top: 0;
    }
    .pager button {
      border: 0;
      background: transparent;
      color: var(--fg);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }
    .pager button:disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }
    .variant-switch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin: 10px 0 0;
      color: var(--soft);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .variant-switch button {
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 0;
    }
    .variant-switch button[aria-pressed="true"] {
      color: var(--fg);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }
    .variant-switch button:disabled {
      opacity: 0.22;
      cursor: not-allowed;
    }
    @media (max-width: 1180px) {
      html, body {
        height: 100%;
        min-height: 100%;
      }
      body {
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,.22) transparent;
      }
      body::-webkit-scrollbar,
      .rail-list::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      body::-webkit-scrollbar-thumb,
      .rail-list::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,.22);
        border-radius: 0;
      }
      .app {
        min-height: 100%;
        grid-template-rows: auto minmax(0, 1fr) auto;
        gap: 12px;
        padding: 14px 14px 20px;
      }
      .workspace {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .menu-grid {
        position: static;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        width: auto;
        gap: 12px;
        align-items: start;
        max-height: min(31vh, 250px);
      }
      .menu-grid .rail:last-child {
        justify-self: stretch;
        width: auto;
      }
      .rail {
        gap: 6px;
        min-width: 0;
      }
      .rail-list {
        display: grid;
        gap: 4px;
        max-height: calc(min(31vh, 250px) - 24px);
        overflow-y: auto;
        overflow-x: hidden;
        padding-right: 4px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,.22) transparent;
      }
      .rail-item {
        width: 100%;
        white-space: normal;
      }
      .rail-item.indent {
        margin-left: 0;
      }
      .viewport {
        grid-column: 1 / -1;
        min-height: auto;
        align-items: start;
        padding-top: 2px;
      }
      .terminal-shell {
        width: 100%;
      }
      .terminal-frame {
        width: 100%;
        height: auto;
      }
      .terminal-content {
        height: auto;
        min-height: 0;
        padding: 22px 16px 16px;
      }
    }
    @media (max-width: 720px) {
      .app {
        padding: 14px 12px 20px;
      }
      .topline {
        font-size: 13px;
        letter-spacing: 0.08em;
      }
      .menu-grid {
        max-height: 34vh;
      }
      .rail-list {
        max-height: calc(34vh - 24px);
      }
      .rail-item {
        font-size: 12px;
      }
      .rail-item.terminal {
        font-size: 11px;
      }
      .terminal-shell,
      .terminal-frame,
      .terminal-screen {
        width: 100%;
      }
      .terminal-screen {
        height: min(52vh, 420px);
      }
      .terminal-content {
        padding: 14px 12px 12px;
      }
      .terminal-body {
        font-size: 12px;
      }
      .doc-section {
        max-width: 100%;
      }
      .doc-image {
        max-width: 100%;
      }
      .doc-text {
        width: max-content;
        font-size: 12px;
      }
      .doc-section.information .doc-text {
        width: max-content;
        margin-left: 10%;
      }
      .doc-pict {
        width: max-content;
        grid-template-columns: 1fr;
      }
      .doc-pict .doc-text {
        width: max-content;
      }
      #classic-pager-host {
        width: 100%;
      }
      .pager {
        font-size: 10px;
      }
      .variant-switch {
        font-size: 10px;
      }
      .variant-switch button {
        font-size: 11px;
      }
    }
    @media (max-width: 520px) {
      .menu-grid {
        grid-template-columns: 1fr;
        gap: 10px;
        max-height: 40vh;
      }
      .rail-list {
        max-height: calc(20vh - 8px);
      }
    }
  </style>
</head>
<body class="classic-marathon-page">
  <nav class="community-nav" aria-label="站点导航">
    <a href="/">首页</a><a href="/news/">最近消息</a><a href="/store/">商店</a><a href="/about/">社区内容</a><a href="/map/perimeter/">地图</a><a href="/marathon-lore/">百科</a><a href="/factions/">阵营</a><a class="active" href="/Classic-marathon/">经典终端</a>
  </nav>
  <main class="app">
    <div class="topline"><span>Classic Marathon</span><div class="series-switch" id="series-switch" aria-label="作品切换"></div></div>
    <section class="workspace" aria-label="navigation and terminal">
      <section class="menu-grid" aria-label="navigation">
        <section class="rail" aria-label="level selection">
          <div class="rail-label">Chapter Select</div>
          <div class="rail-list" id="chapter-list"></div>
        </section>

        <section class="rail" aria-label="terminal selection">
          <div class="rail-label">Terminal</div>
          <div class="rail-list" id="terminal-list"></div>
        </section>
      </section>
      <section class="viewport">
        <div class="terminal-shell">
          <div class="terminal-frame">
            <div class="terminal-screen">
              <div class="terminal-strip terminal-strip-meta">
                <span class="terminal-strip-text" id="terminal-top-strip-text">Opening Connection to β.4.5-23</span>
                <span class="terminal-strip-text" id="terminal-top-strip-time"></span>
              </div>
              <div class="terminal-content" id="terminal-view">
                <div class="terminal-body" id="terminal-body"></div>
              </div>
              <div class="terminal-strip terminal-strip-meta">
                <span class="terminal-strip-text">CAS.qterm//CyberAcme Systems Inc.</span>
                <span class="terminal-strip-text">&lt;931.461.60231.14.vt920&gt;</span>

          </div>

      <span aria-hidden="true"> · </span>
      <a href="https://steamcommunity.com/sharedfiles/filedetails/?id=3466301767" target="_blank" rel="noopener noreferrer">M2 社区指南</a>
    </footer>
  </main>

  <script>
    const catalog = [];

    const state = {
      classicIndex: 0,
      chapterIndex: 0,
      terminalIndex: 0,
      pageIndex: 0,
      variantPreference: null,
      coverGroup: null,
      collapsedGroups: {}
    };

    const el = {
      chapter: document.getElementById('chapter-list'),
      terminal: document.getElementById('terminal-list'),
      body: document.getElementById('terminal-body'),
      topStripText: document.getElementById('terminal-top-strip-text'),
      topStripTime: document.getElementById('terminal-top-strip-time'),
      variantHost: document.getElementById('classic-variant-host'),
      pagerHost: document.getElementById('classic-pager-host'),
      series: document.getElementById('series-switch')
    };

    const fallbackSeries = {
      id: 'm1',
      label: '1',
      title: 'Classic Marathon 1',
      chapters: []
    };

    const CHAPTER_GROUPS = {
      m1: [
        { from: '00', to: '02', image: '/Classic-marathon/chapter-images/M1-01500.png' },
        { from: '03', to: '09', image: '01503.bmp' },
        { from: '10', to: '11', image: '01510.bmp' },
        { from: '12', to: '16', image: '01512.bmp' },
        { from: '17', to: '23', image: '01516.bmp' },
        { from: '24', to: '26', image: '01524.bmp' },
        { after: '26', image: '01598.bmp' }
      ],
      m2: [
        { from: '00', to: '02', image: '/Classic-marathon/chapter-images/M2-01500.png' },
        { from: '03', to: '05', image: '01503.bmp' },
        { from: '06', to: '08', image: '01506.bmp' },
        { from: '09', to: '12', image: '01509.bmp' },
        { from: '13', to: '17', image: '01513.bmp' },
        { from: '18', to: '18', image: '01517.bmp' },
        { from: '19', to: '21', image: '01518.bmp' },
        { from: '22', to: '24', image: '01522.bmp' },
        { from: '25', to: '27', image: '01525.bmp' }
      ]
    };

    function findAdjacentTerminal(step) {
      const classic = currentClassic();
      const chapters = Array.isArray(classic.chapters) ? classic.chapters : [];
      if (!chapters.length) return null;

      if (step > 0) {

        while (chapterIndex < chapters.length) {
          const terminals = Array.isArray(chapters[chapterIndex]?.terminals) ? chapters[chapterIndex].terminals : [];
          if (terminalIndex < terminals.length) {

          chapterIndex += 1;

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'rail-item' + (extraClass ? ' ' + extraClass : '') + (index === 0 && extraClass === 'indent' ? '' : '');

        button.setAttribute('aria-selected', index === selectedIndex ? 'true' : 'false');

        if (extraClass === 'indent' && index > 0) button.classList.add('indent');

    function roman(n) {
      const values = [1000, 900, 500, 400, 100, 90, 50, 40, 10, 9, 5, 4, 1];
      const numerals = ['M', 'CM', 'D', 'CD', 'C', 'XC', 'L', 'XL', 'X', 'IX', 'V', 'IV', 'I'];
      let out = '';
      for (let i = 0; i < values.length; i++) {
        while (n >= values[i]) {
          out += numerals[i];
          n -= values[i];
        }
      }
      return out;

          if (event.key === 'Escape') {
            close();
            document.removeEventListener('keydown', onKey);
          }
        });
        document.body.appendChild(lightbox);
      });
      img.addEventListener('error', () => {
        img.alt = 'CHAPTER ' + roman(groupIndex + 1) + ' image unavailable';
        img.classList.add('image-error');
      });
      section.appendChild(img);

      const title = document.createElement('div');
      title.className = 'chapter-cover-title';
      title.textContent = group.after ? 'END' : 'CHAPTER ' + roman(groupIndex + 1);
      section.appendChild(title);

      const intro = CHAPTER_INTROS[classic.id];
      if (groupIndex === 0 && intro) {
        const textNode = document.createElement('div');
        textNode.className = 'doc-text chapter-cover-intro';
        textNode.textContent = intro;
        section.appendChild(textNode);
      }

      return section;
    }

    function setCoverMode(on) {
      const screen = document.querySelector('.terminal-screen');
      if (screen) screen.classList.toggle('cover-mode', Boolean(on));
      const rail = el.terminal ? el.terminal.closest('.rail') : null;
      if (rail) rail.hidden = Boolean(on);
    }

    function adjacentCover(step) {
      const groups = CHAPTER_GROUPS[currentClassic().id] || [];
      const next = state.coverGroup + step;
      return next >= 0 && next < groups.length ? next : null;
    }

    const textCache = new Map();
    let renderSeq = 0;
    const WRAP_LIMIT = 35;
    const PICT_WRAP_LIMIT = 21;
    const TERMINAL_VARIANTS = ['UNFINISHED', 'FINISHED'];
    const AO_MARKERS = {
      '$B': { style: 'bold', open: true },
      '$b': { style: 'bold', open: false },
      '$I': { style: 'italic', open: true },
      '$i': { style: 'italic', open: false },
      '$U': { style: 'underline', open: true },
      '$u': { style: 'underline', open: false }
    };
    const AO_COLORS = {
      '$C0': '#00FF00', '$C1': '#FFFFFF', '$C2': '#FF0000', '$C3': '#009C00',
      '$C4': '#00B0C9', '$C5': '#FFE700', '$C6': '#AF0000', '$C7': '#0C00FF'
    };

    function joinPath(...parts) {
      return parts
        .filter(Boolean)
        .map(part => String(part).replace(/^\/+|\/+$/g, ''))
        .join('/');
    }

    function terminalBase(level, terminal) {
      const classic = currentClassic();
      return '/' + joinPath('Classic-marathon', classic.path, 'text', level.dirName || level.label || level.name || level.id || '', terminal.name || '');
    }

    function resolveImagePath(fileName) {
      return '/' + joinPath('Classic-marathon', currentClassic().path, 'picts', fileName);
    }

    async function fetchTextFile(url) {
      if (textCache.has(url)) return textCache.get(url);
      const pending = fetch(url, { cache: 'no-store' }).then(response => {
        if (!response.ok) throw new Error('Failed to fetch ' + url);
        return response.text();
      });
      textCache.set(url, pending);
      return pending;
    }

    function terminalVariantFromFile(fileName) {
      const match = String(fileName || '').match(/^(FINISHED|UNFINISHED)_/);
      return match ? match[1] : null;
    }

    function replaceTerminalVariant(fileName, variant) {
      return String(fileName || '').replace(/^(FINISHED|UNFINISHED)_/, variant + '_');
    }

    function tokenizeAOText(text) {
      const normalized = String(text || '').replace(/\r\n?/g, '\n');
      const tokens = [];
      let buffer = '';

      function pushBuffer() {
        if (!buffer) return;
        tokens.push({ type: 'text', value: buffer });
        buffer = '';
      }

      for (let index = 0; index < normalized.length; index += 1) {
        const pair = normalized.slice(index, index + 2);
        const colorMarker = normalized.slice(index, index + 3);

        if (normalized[index] === '\n') {
          pushBuffer();
          tokens.push({ type: 'newline', value: '\n' });
          continue;
        }

        if (AO_MARKERS[pair]) {
          pushBuffer();
          tokens.push({
            type: 'marker',
            value: pair,
            style: AO_MARKERS[pair].style,
            open: AO_MARKERS[pair].open,
            paired: false
          });
          index += 1;
          continue;
        }

        if (AO_COLORS[colorMarker]) {
          pushBuffer();
          tokens.push({ type: 'color', value: colorMarker, color: AO_COLORS[colorMarker] });
          index += 2;
          continue;
        }

        buffer += normalized[index];
      }

      pushBuffer();

      const stacks = {
        bold: [],
        italic: [],
        underline: []
      };

      tokens.forEach((token, tokenIndex) => {
        if (token.type !== 'marker') return;

        if (token.open) {
          stacks[token.style].push(tokenIndex);
          return;
        }

        const openIndex = stacks[token.style].pop();
        if (openIndex === undefined) return;
        tokens[openIndex].paired = true;
        token.paired = true;
      });

      return tokens.map(token => {
        if (token.type === 'marker' && !token.paired) {
          return { type: 'text', value: token.value };
        }
        return token;
      });
    }

    function splitAOTokensByLine(tokens) {
      const lines = [[]];

      tokens.forEach(token => {
        if (token.type === 'newline') {
          lines.push([]);
          return;
        }
        lines[lines.length - 1].push(token);
      });

      return lines;
    }

    function wrapAOLineTokens(tokens, limit) {
      if (!tokens.length) return [];

      const wrapped = [];
      let width = 0;

      function pushWrappedLine() {
        wrapped.push({ type: 'newline', value: '\n' });
        width = 0;
      }

      tokens.forEach(token => {
        if (token.type === 'marker' || token.type === 'color') {
          wrapped.push(token);
          return;
        }

        for (const visibleToken of tokenizeTerminalLine(token.value)) {
          for (const segment of splitOversizeToken(visibleToken, limit)) {
            const segmentWidth = tokenWidthUnits(segment);
            if (width > 0 && width + segmentWidth > limit) {
              pushWrappedLine();
            }

            wrapped.push({ type: 'text', value: segment });
            width += segmentWidth;
          }
        }
      });

      return wrapped;
    }

    function buildAOTokens(text, limit = null) {
      const tokens = tokenizeAOText(text);
      if (limit === null) return tokens;

      const lines = splitAOTokensByLine(tokens);
      const wrapped = [];

      lines.forEach((lineTokens, index) => {
        wrapped.push(...wrapAOLineTokens(lineTokens, limit));
        if (index < lines.length - 1) {
          wrapped.push({ type: 'newline', value: '\n' });
        }
      });

      return wrapped;
    }

    function appendAORender(target, text, limit = null, defaultColor = AO_COLORS.$C0) {
      const tokens = buildAOTokens(text, limit);
      const state = {
        color: AO_COLORS[defaultColor] || defaultColor || AO_COLORS.$C0,
        bold: false,
        italic: false,
        underline: false
      };
      let activeSpan = null;
      let activeClassName = '';

      function currentClassName() {
        return [
          state.bold ? 'ao-bold' : '',
          state.italic ? 'ao-italic' : '',
          state.underline ? 'ao-underline' : ''
        ].filter(Boolean).join(' ');
      }

      function appendStyledText(value) {
        const className = currentClassName();
        const color = state.color;
        if (!className && color === AO_COLORS.$C0) {
          target.appendChild(document.createTextNode(value));
          activeSpan = null;
          activeClassName = '';
          return;
        }

        if (!activeSpan || activeClassName !== className || activeSpan.style.color !== color) {
          activeSpan = document.createElement('span');
          activeSpan.className = className;
          activeSpan.style.color = color;
          activeClassName = className;
          target.appendChild(activeSpan);
        }

        activeSpan.appendChild(document.createTextNode(value));
      }

      tokens.forEach(token => {
        if (token.type === 'marker') {
          state[token.style] = token.open;
          activeSpan = null;
          activeClassName = '';
          return;
        }

        if (token.type === 'color') {
          state.color = token.color;
          activeSpan = null;
          activeClassName = '';
          return;
        }

        if (token.type === 'newline') {
          target.appendChild(document.createTextNode('\n'));
          state.color = AO_COLORS[defaultColor] || defaultColor || AO_COLORS.$C0;
          activeSpan = null;
          activeClassName = '';
          return;
        }

        appendStyledText(token.value);
      });
    }

    function toInformationItems(fileName, variant, defaultColor) {
      if (!fileName) return [];
      const files = Array.isArray(fileName) ? fileName : [fileName];
      return files.map(file => ({
        kind: 'information',
        file: replaceTerminalVariant(file, variant),
        image: null,
        defaultColor
      }));
    }

    function buildVariantItems(terminal, variant) {
      const variantData = terminal.variantData?.[variant];
      if (variantData) {
        return [
          { kind: 'logon', file: variantData.logon, image: variantData.logonImage, defaultColor: variantData.defaultColor },
          ...toInformationItems(variantData.information, variant, variantData.defaultColor),
          ...((variantData.picts || []).map(item => ({ kind: 'pict', ...item, defaultColor: variantData.defaultColor }))),
          { kind: 'logoff', file: variantData.logoff, image: variantData.logoffImage, defaultColor: variantData.defaultColor }
        ].filter(item => item.file);
      }

      return [
        { kind: 'logon', file: replaceTerminalVariant(terminal.logon, variant), image: terminal.logonImage || '01600.bmp' },
        ...toInformationItems(terminal.information, variant),
        ...((terminal.picts || []).map(item => ({
          kind: 'pict',
          file: replaceTerminalVariant(item.file, variant),
          image: item.image
        }))),
        { kind: 'logoff', file: replaceTerminalVariant(terminal.logoff, variant), image: terminal.logoffImage || '01600.bmp' }
      ].filter(item => item.file);
    }

    function resolveTerminalVariants(terminal) {
      const declaredVariants = Array.isArray(terminal.variants) && terminal.variants.length
        ? terminal.variants.filter(variant => TERMINAL_VARIANTS.includes(variant))
        : [terminalVariantFromFile(terminal.logon) || 'UNFINISHED'];
      const defaultVariant =
        terminal.defaultVariant ||
        terminalVariantFromFile(terminal.logon) ||
        terminalVariantFromFile(terminal.information) ||
        terminalVariantFromFile(terminal.logoff) ||
        terminalVariantFromFile(terminal.picts?.[0]?.file) ||
        declaredVariants[0] ||
        'UNFINISHED';

      const available = declaredVariants.map(variant => ({
        key: variant,
        items: buildVariantItems(terminal, variant)
      }));

      return {
        defaultVariant,
        available,
        hasToggle: available.length > 1
      };
    }

    function charWidthUnits(char) {
      if (!char) return 0;
      if (char === '\t') return 2;
      return /[^\u0000-\u00ff]/.test(char) ? 1 : 0.5;
    }

    function tokenWidthUnits(token) {
      let width = 0;
      for (const char of token) width += charWidthUnits(char);
      return width;
    }

    function splitOversizeToken(token, limit) {
      if (!token || tokenWidthUnits(token) <= limit) return [token];

      const segments = [];
      let current = '';
      let width = 0;

      for (const char of token) {
        const charWidth = charWidthUnits(char);
        if (current && width + charWidth > limit) {
          segments.push(current);
          current = char;
          width = charWidth;
          continue;
        }

        current += char;
        width += charWidth;
      }

      if (current) segments.push(current);
      return segments;
    }

    function tokenizeTerminalLine(line) {
      const tokens = [];
      let current = '';
      let mode = '';

      for (const char of line) {
        const isWhitespace = char === ' ' || char === '\t';
        const isHalfWidth = !/[^\u0000-\u00ff]/.test(char);
        const nextMode = isWhitespace ? 'space' : (isHalfWidth ? 'word' : 'full');

        if (nextMode === 'full') {
          if (current) tokens.push(current);
          current = '';
          mode = '';
          tokens.push(char);
          continue;
        }

        if (mode && mode !== nextMode) {
          tokens.push(current);
          current = '';
        }

        current += char;
        mode = nextMode;
      }

      if (current) tokens.push(current);
      return tokens;
    }

    function wrapTerminalText(text, limit = WRAP_LIMIT) {
      return buildAOTokens(text, limit)
        .map(token => token.value)
        .join('');
    }

    function loadClassicCatalog(path, label, title) {
      return fetch('/Classic-marathon/' + path + '/terminals.json', { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Failed to load terminals.json');
          return response.json();
        })
        .then(data => {
          const levels = Array.isArray(data?.levels) ? data.levels : [];
          return [{
            id: path.toLowerCase(), path, label, title,
            chapters: levels.map(level => ({
              id: level.id || level.name,
              label: (level.id ? level.id + ' ' : '') + (level.name || level.id || ''),
              dirName: level.dirName || (level.id ? level.id + ' ' : '') + (level.name || level.id || ''),
              terminals: (Array.isArray(level.terminals) ? level.terminals : []).map(term => ({
                ...term,
                label: term.name || 'Terminal'
              })),
              meta: level
            }))
          }];
        })
        .catch(() => [{
          id: path.toLowerCase(), path, label, title,
          chapters: []
        }]);
    }

    function loadCatalog() {
      return Promise.all([
        loadClassicCatalog('M1', 'M1', 'Classic Marathon 1'),
        loadClassicCatalog('M2', 'M2', 'Classic Marathon 2')
      ]).then(series => series.flat());
    }

    function renderSeriesSwitch() {
      el.series.innerHTML = '';
      catalog.forEach((series, index) => {
        const button = document.createElement('button');
        button.type = 'button'; button.textContent = series.id === 'm1' ? 'M1(1994)' : series.id === 'm2' ? 'M2(1995)' : series.label;
        button.setAttribute('aria-pressed', index === state.classicIndex ? 'true' : 'false');
        button.addEventListener('click', () => {
          if (index === state.classicIndex) return;
          const rail = el.chapter ? el.chapter.closest('.rail') : null;
          if (rail) {
            rail.style.width = '';
            rail._fixedWidth = false;
          }
          state.classicIndex = index; state.chapterIndex = 0; state.terminalIndex = 0; state.pageIndex = 0; state.variantPreference = null; state.coverGroup = null;
          renderSeriesSwitch(); updateView();
        });
        el.series.appendChild(button);
      });
    }

    function setLoadingState() {
      el.body.innerHTML = '';
      const loading = document.createElement('div');
      loading.className = 'loading-state';
      loading.textContent = 'Loading terminal...';
      el.body.appendChild(loading);
    }

    function buildDocSection(kind, text, imageSrc, defaultColor) {
      const section = document.createElement('section');
      section.className = 'doc-section';
      const textLimit =
        kind === 'pict'
          ? PICT_WRAP_LIMIT
          : kind === 'information'
            ? WRAP_LIMIT
            : null;

      if (kind === 'pict') {
        const row = document.createElement('div');
        row.className = 'doc-pict';

        if (imageSrc) {
          const img = document.createElement('img');
          img.className = 'doc-image';
          img.src = imageSrc;
          img.alt = 'Marathon pict';
          row.appendChild(img);
        }

        const textNode = document.createElement('pre');
        textNode.className = 'doc-text';
        appendAORender(textNode, text, textLimit, defaultColor);
        row.appendChild(textNode);
        section.appendChild(row);
      } else {
        if (kind === 'logon' || kind === 'logoff') {
          section.classList.add('centered');
        } else if (kind === 'information') {
          section.classList.add('information');
        }
        if (imageSrc) {
          const img = document.createElement('img');
          img.className = 'doc-image';
          img.src = imageSrc;
          img.alt = 'Marathon terminal image';
          section.appendChild(img);
        }

        const textNode = document.createElement('pre');
        textNode.className = 'doc-text';
        appendAORender(textNode, text, textLimit, defaultColor);
        section.appendChild(textNode);
      }
      return section;
    }

    async function renderDocument(level, terminal, items) {
      const renderItems = items || buildVariantItems(terminal, terminalVariantFromFile(terminal.logon) || 'UNFINISHED');

      const results = await Promise.all(renderItems.map(async item => {
        if (!item.file) return null;
        const text = await fetchTextFile(terminalBase(level, terminal) + '/' + item.file).catch(() => '');
        return {
          kind: item.kind,
          text,
          image: item.image ? resolveImagePath(item.image) : null,
          defaultColor: item.defaultColor || terminal.defaultColor || AO_COLORS.$C0
        };
      }));

      return results.filter(Boolean);
    }

    function renderVariantSwitch(variants, activeVariant) {
      const wrap = document.createElement('div');
      wrap.className = 'variant-switch';

      const label = document.createElement('span');
      label.textContent = 'Mode';
      wrap.appendChild(label);

      variants.forEach(variant => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = variant.key;
        button.setAttribute('aria-pressed', variant.key === activeVariant ? 'true' : 'false');
        button.addEventListener('click', () => {
          if (state.variantPreference === variant.key) return;
          state.variantPreference = variant.key;
          state.pageIndex = 0;
          updateView();
        });
        wrap.appendChild(button);
      });

      return wrap;
    }

    function topStripTextForKind(kind) {
      if (kind === 'information' || kind === 'pict') {
        return 'UESCTerm 802.11 (remote override)';
      }
      if (kind === 'logoff') {
        return 'Disconnecting...';
      }
      return 'Opening Connection to β.4.5-23';
    }

    function formatTerminalTimestamp(date = new Date()) {
      const pad = value => String(value).padStart(2, '0');
      return [
        pad(date.getHours()) + pad(date.getMinutes()),
        pad(date.getMonth() + 1) + '.' + pad(date.getDate()) + '.' + date.getFullYear()
      ].join(' ');
    }

    function updateTopStripTimestamp() {
      if (!el.topStripTime) return;
      el.topStripTime.textContent = formatTerminalTimestamp();
    }

    function renderPager(totalPages, currentPage, canMovePrev, canMoveNext) {
      const pager = document.createElement('div');
      pager.className = 'pager';

      const prev = document.createElement('button');
      prev.type = 'button';
      prev.textContent = 'Prev';
      prev.disabled = !canMovePrev;

      const label = document.createElement('span');
      label.textContent = (currentPage + 1) + ' / ' + totalPages;

      const next = document.createElement('button');
      next.type = 'button';
      next.textContent = 'Next';
      next.disabled = !canMoveNext;

      pager.appendChild(prev);
      pager.appendChild(label);
      pager.appendChild(next);
      return { pager, prev, next };
    }

    async function updateView() {
      const seq = ++renderSeq;
      const classic = currentClassic();
      const chapter = currentChapter();
      const terminal = currentTerminal();
      const groups = CHAPTER_GROUPS[classic.id] || [];
      const collapsedSet = state.collapsedGroups[classic.id] || (state.collapsedGroups[classic.id] = new Set());

      renderGroupedRail(
        el.chapter,
        classic,
        state.chapterIndex,
        state.coverGroup,
        collapsedSet,
        index => {
          state.chapterIndex = index;
          state.terminalIndex = 0;
          state.pageIndex = 0;
          state.coverGroup = null;
          updateView();
        },
        groupIndex => {
          // 左侧按钮：仅切换收起/展开
          if (collapsedSet.has(groupIndex)) collapsedSet.delete(groupIndex);
          else collapsedSet.add(groupIndex);
          updateView();
        },
        groupIndex => {
          // 章节名：进入封面
          state.coverGroup = groupIndex;
          state.pageIndex = 0;
          updateView();
        }
      );

      // 封面模式：点击章节标题后显示章节配图，隐藏终端红栏
      if (state.coverGroup !== null && groups[state.coverGroup]) {
        const group = groups[state.coverGroup];
        setCoverMode(true);
        el.variantHost.innerHTML = '';
        el.topStripText.textContent = group.after ? 'END' : 'CHAPTER ' + roman(state.coverGroup + 1);

        el.body.innerHTML = '';
        el.body.appendChild(renderChapterCover(classic, group, state.coverGroup));

        const prevGroup = adjacentCover(-1);
        const firstIdx = firstLevelIndexForGroup(classic, state.coverGroup);
        const endLeadsToM2 = classic.id === 'm1' && group.after;
        const pager = renderPager(1, 0, prevGroup !== null, firstIdx !== null || endLeadsToM2);
        pager.prev.addEventListener('click', () => {
          state.coverGroup = prevGroup;
          updateView();
        });
        pager.next.addEventListener('click', () => {
          // M1's END leads into M2's opening chapter.
          if (classic.id === 'm1' && group.after) {
            const nextClassicIndex = catalog.findIndex(series => series.id === 'm2');
            if (nextClassicIndex >= 0) {
              state.classicIndex = nextClassicIndex;
              state.chapterIndex = 0;
              state.terminalIndex = 0;
              state.pageIndex = 0;
              state.coverGroup = 0;
              state.variantPreference = null;
              renderSeriesSwitch();
              updateView();
            }
            return;
          }
          if (firstIdx === null) return;
          collapsedSet.delete(state.coverGroup);
          state.coverGroup = null;
          state.chapterIndex = firstIdx;
          state.terminalIndex = 0;
          state.pageIndex = 0;
          updateView();
        });
        el.pagerHost.innerHTML = '';
        el.pagerHost.appendChild(pager.pager);
        return;
      }

      setCoverMode(false);

      renderRail(
        el.terminal,
        (chapter?.terminals || []).map(text => (typeof text === 'string' ? { label: text } : text)),
        state.terminalIndex,
        index => {
          state.terminalIndex = index;
          state.pageIndex = 0;
          updateView();
        },
        'terminal',
        !chapter || !chapter.terminals || chapter.terminals.length === 0
      );

      if (!chapter || !terminal) {
        setLoadingState();
        el.variantHost.innerHTML = '';
        return;
      }

      setLoadingState();
      el.variantHost.innerHTML = '';

      const variantState = resolveTerminalVariants(terminal);

      const activeVariant =
        variantState.available.find(entry => entry.key === state.variantPreference)?.key ||
        variantState.available.find(entry => entry.key === variantState.defaultVariant)?.key ||
        variantState.available[0]?.key ||
        variantState.defaultVariant;

      const activeItems =
        variantState.available.find(entry => entry.key === activeVariant)?.items ||
        buildVariantItems(terminal, activeVariant);

      const doc = await renderDocument(chapter, terminal, activeItems);
      if (seq !== renderSeq) return;

      el.body.innerHTML = '';
      el.variantHost.innerHTML = '';
      const pages = doc.length ? doc : [{ kind: 'information', text: '', image: null }];
      state.pageIndex = Math.max(0, Math.min(state.pageIndex, pages.length - 1));
      const page = pages[state.pageIndex];
      el.topStripText.textContent = topStripTextForKind(page.kind);
      el.body.appendChild(buildDocSection(page.kind, page.text, page.image, page.defaultColor));

      const canMovePrev = state.pageIndex > 0 || hasAdjacentTerminal(-1);
      const canMoveNext = state.pageIndex < pages.length - 1 || hasAdjacentTerminal(1);
      const pager = renderPager(pages.length, state.pageIndex, canMovePrev, canMoveNext);
      pager.prev.addEventListener('click', () => {
        if (state.pageIndex > 0) {
          state.pageIndex -= 1;
        } else {
          const target = findAdjacentTerminal(-1);
          if (!target) {
            state.pageIndex = 0;
          } else if (groupIndexForLevel(classic, classic.chapters[target.chapterIndex].id) !== groupIndexForLevel(classic, classic.chapters[state.chapterIndex].id)) {
            state.chapterIndex = target.chapterIndex;
            state.terminalIndex = target.terminalIndex;
            state.coverGroup = groupIndexForLevel(classic, classic.chapters[target.chapterIndex].id);
            state.pageIndex = 0;
          } else {
            moveTerminal(-1);
          }
        }
        updateView();
      });
      pager.next.addEventListener('click', () => {
        if (state.pageIndex < pages.length - 1) {
          state.pageIndex += 1;
        } else {
          const target = findAdjacentTerminal(1);
          if (!target) {
            state.pageIndex = pages.length - 1;
          } else if (groupIndexForLevel(classic, classic.chapters[target.chapterIndex].id) !== groupIndexForLevel(classic, classic.chapters[state.chapterIndex].id)) {
            state.chapterIndex = target.chapterIndex;
            state.terminalIndex = target.terminalIndex;
            state.coverGroup = groupIndexForLevel(classic, classic.chapters[target.chapterIndex].id);
            state.pageIndex = 0;
          } else {
            moveTerminal(1);
          }
        }
        updateView();
      });
      el.pagerHost.innerHTML = '';
      el.pagerHost.appendChild(pager.pager);
      if (variantState.hasToggle) {
        el.variantHost.appendChild(renderVariantSwitch(variantState.available, activeVariant));
      }
    }

    loadCatalog().then(data => {
      catalog.splice(0, catalog.length, ...data);
      state.classicIndex = 0;
      state.chapterIndex = 0;
      state.terminalIndex = 0;
      state.pageIndex = 0;
      state.coverGroup = 0;
      renderSeriesSwitch();
      updateTopStripTimestamp();
      updateView();
    });

    updateTopStripTimestamp();
    window.setInterval(updateTopStripTimestamp, 1000);

    document.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      window.location.href = '/';
    });
  </script>
</body>
</html>
